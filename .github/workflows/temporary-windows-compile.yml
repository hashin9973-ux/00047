name: Temporary Windows Compile Check

on:
  push:
    branches:
      - compile-check-liquidglass

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> src-tauri/target

      - name: Compile 00047 for Windows x64
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Upload compiled executable
        uses: actions/upload-artifact@v4
        with:
          name: 00047-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/app-00047.exe
          if-no-files-found: error
          retention-days: 7
