name: Windows verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate native-mod authoring tools
        run: python -m unittest discover -s tools/tests -v

      - name: Audit non-hook Windhawk lifecycle sample
        run: python tools/audit_windhawk_mod.py sdk/native-mod/tests/windhawk_nonhook_adapter_smoke.cpp --fail-on-unsupported

      - name: Check frontend JavaScript syntax
        shell: pwsh
        run: |
          node --check ui/blocks.js
          node --check ui/editor.js
          node --check ui/app.js
          node --check ui/extensions.js
          node --check ui/native-mods.js

      - name: Validate Tauri JSON configuration
        shell: pwsh
        run: |
          node -e "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('src-tauri/capabilities/default.json', 'utf8'))"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format Rust sources before compilation
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Compile for Windows
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build native-mod remote-integration fixtures
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "00047-nonhook-compat-tests"
          cmake -S sdk/native-mod/tests -B $build -A x64
          cmake --build $build --config Release --target 00047_windhawk_nonhook_adapter_smoke 00047_native_mod_hook_integration_smoke 00047_native_mod_failed_init_smoke 00047_native_mod_integration_target
          $targetExe = Join-Path $build "Release/explorer.exe"
          $successDll = Join-Path $build "Release/00047_native_mod_hook_integration_smoke.dll"
          $failedInitDll = Join-Path $build "Release/00047_native_mod_failed_init_smoke.dll"
          foreach ($file in @($targetExe, $successDll, $failedInitDll)) {
            if (-not (Test-Path $file)) { throw "Required remote native-mod integration fixture was not created: $file" }
          }
          "WMOD_NATIVE_INTEGRATION_TARGET_EXE=$targetExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WMOD_NATIVE_INTEGRATION_DLL=$successDll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WMOD_NATIVE_FAILED_INIT_DLL=$failedInitDll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run workflow engine regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and package the native mod SDK sample
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "00047-native-mod-build"
          cmake -S samples/native-mod -B $build -A x64
          cmake --build $build --config Release
          $dll = Join-Path $build "Release/00047_sample_native_mod.dll"
          $zip = Join-Path $env:RUNNER_TEMP "00047-sample-native-mod.zip"
          python tools/package_native_mod.py --manifest samples/native-mod/manifest.json --dll $dll --output $zip
          python tools/validate_native_mod.py $zip
          if (-not (Test-Path $zip)) { throw "Native mod sample package was not created." }

          # Exercise the public project generator all the way through compilation,
          # packaging, and ABI validation using the actual Windows x64 toolchain.
          $generatedRoot = Join-Path $env:RUNNER_TEMP "00047-generated-mods"
          python tools/new_native_mod.py --id com.example.ci-generated --name "CI Generated Mod" --output-dir $generatedRoot
          $project = Join-Path $generatedRoot "com.example.ci-generated"
          $generatedBuild = Join-Path $project "build"
          $sdk = (Resolve-Path "sdk/native-mod").Path
          cmake -S $project -B $generatedBuild -A x64 "-DWMOD_SDK_DIR=$sdk"
          cmake --build $generatedBuild --config Release
          $generatedDll = Join-Path $generatedBuild "bin/Release/com_example_ci_generated.dll"
          $generatedZip = Join-Path $env:RUNNER_TEMP "00047-generated-native-mod.zip"
          python tools/package_native_mod.py --manifest (Join-Path $project "manifest.json") --dll $generatedDll --output $generatedZip
          python tools/validate_native_mod.py $generatedZip

      - name: Compile and run non-hook Windhawk-style compatibility tests
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "00047-nonhook-compat-tests"
          cmake -S sdk/native-mod/tests -B $build -A x64
          cmake --build $build --config Release
          $testExe = Join-Path $build "Release/00047_native_mod_compat_test.exe"
          if (-not (Test-Path $testExe)) { throw "Native SDK compatibility test executable was not created." }
          & $testExe
          if ($LASTEXITCODE -ne 0) { throw "Native SDK compatibility test failed with exit code $LASTEXITCODE." }

          $adapterTestExe = Join-Path $build "Release/00047_windhawk_nonhook_adapter_runtime_test.exe"
          $adapterTestDll = Join-Path $build "Release/00047_windhawk_nonhook_adapter_smoke.dll"
          if (-not (Test-Path $adapterTestExe)) { throw "Non-hook lifecycle adapter runtime test executable was not created." }
          if (-not (Test-Path $adapterTestDll)) { throw "Non-hook lifecycle adapter smoke DLL was not created." }
          & $adapterTestExe $adapterTestDll
          if ($LASTEXITCODE -ne 0) { throw "Non-hook lifecycle adapter runtime test failed with exit code $LASTEXITCODE." }

          $hookTestExe = Join-Path $build "Release/00047_windhawk_hook_runtime_test.exe"
          $hookTestDll = Join-Path $build "Release/00047_windhawk_hook_runtime_smoke.dll"
          if (-not (Test-Path $hookTestExe)) { throw "Native hook runtime test executable was not created." }
          if (-not (Test-Path $hookTestDll)) { throw "Native hook runtime smoke DLL was not created." }
          & $hookTestExe $hookTestDll
          if ($LASTEXITCODE -ne 0) { throw "Native hook runtime test failed with exit code $LASTEXITCODE." }
          cmake --build $build --config Release --target 00047_signature_verifier_smoke
          $signatureTestExe = Join-Path $build "Release/00047_signature_verifier_smoke.exe"
          if (-not (Test-Path $signatureTestExe)) { throw "Authenticode verifier smoke test was not created." }
          $unsignedFixture = Join-Path $env:RUNNER_TEMP "00047-native-mod-build/Release/00047_sample_native_mod.dll"
          if (-not (Test-Path $unsignedFixture)) { throw "Expected unsigned native-mod fixture was not created." }
          & $signatureTestExe $unsignedFixture
          if ($LASTEXITCODE -ne 0) { throw "Authenticode verifier smoke test failed with exit code $LASTEXITCODE." }

          $symbolTestExe = Join-Path $build "Release/00047_windhawk_symbol_compat_test.exe"
          if (-not (Test-Path $symbolTestExe)) { throw "Symbol compatibility test executable was not created." }
          & $symbolTestExe
          if ($LASTEXITCODE -ne 0) { throw "Windhawk symbol compatibility test failed with exit code $LASTEXITCODE." }

          $settingsTestExe = Join-Path $build "Release/00047_windhawk_settings_changed_runtime_test.exe"
          $settingsSmokeDll = Join-Path $build "Release/00047_windhawk_settings_changed_smoke.dll"
          if (-not (Test-Path $settingsTestExe)) { throw "Settings-change runtime test executable was not created." }
          if (-not (Test-Path $settingsSmokeDll)) { throw "Settings-change smoke DLL was not created." }
          & $settingsTestExe $settingsSmokeDll
          if ($LASTEXITCODE -ne 0) { throw "Settings-change runtime test failed with exit code $LASTEXITCODE." }

      - name: Build and validate language-neutral native-mod ABI samples
        shell: pwsh
        run: |
          $sample = "samples/native-mod-rust"
          cargo build --manifest-path "$sample/Cargo.toml" --target x86_64-pc-windows-msvc --release --locked
          $dll = Join-Path $sample "target/x86_64-pc-windows-msvc/release/example_rust_native_mod.dll"
          $zip = Join-Path $env:RUNNER_TEMP "00047-rust-native-mod.zip"
          if (-not (Test-Path $dll)) { throw "Rust native-mod DLL was not created: $dll" }
          python tools/package_native_mod.py --manifest (Join-Path $sample "manifest.json") --dll $dll --output $zip
          python tools/validate_native_mod.py $zip

          $build = Join-Path $env:RUNNER_TEMP "00047-nonhook-compat-tests"
          cmake --build $build --config Release --target 00047_native_mod_abi_smoke 00047_native_mod_c_abi_smoke
          $abiTest = Join-Path $build "Release/00047_native_mod_abi_smoke.exe"
          $cDll = Join-Path $build "Release/00047_native_mod_c_abi_smoke.dll"
          if (-not (Test-Path $abiTest)) { throw "Native-mod ABI smoke test was not created." }
          if (-not (Test-Path $cDll)) { throw "C native-mod ABI fixture was not created." }
          & $abiTest $cDll
          if ($LASTEXITCODE -ne 0) { throw "C native-mod ABI smoke test failed with exit code $LASTEXITCODE." }
          & $abiTest $dll
          if ($LASTEXITCODE -ne 0) { throw "Rust native-mod ABI smoke test failed with exit code $LASTEXITCODE." }

          # Exercise the Rust project generator through build, package validation,
          # and runtime ABI validation on the Windows x64 toolchain.
          $generatedRustRoot = Join-Path $env:RUNNER_TEMP "00047-generated-rust-mods"
          python tools/new_native_mod.py --id com.example.ci-rust-generated --name "CI Generated Rust Mod" --language rust --output-dir $generatedRustRoot
          $generatedRust = Join-Path $generatedRustRoot "com.example.ci-rust-generated"
          cargo build --manifest-path "$generatedRust/Cargo.toml" --target x86_64-pc-windows-msvc --release --locked
          $generatedRustDll = Join-Path $generatedRust "target/x86_64-pc-windows-msvc/release/com_example_ci_rust_generated.dll"
          $generatedRustZip = Join-Path $env:RUNNER_TEMP "00047-generated-rust-native-mod.zip"
          python tools/package_native_mod.py --manifest (Join-Path $generatedRust "manifest.json") --dll $generatedRustDll --output $generatedRustZip
          python tools/validate_native_mod.py $generatedRustZip
          & $abiTest $generatedRustDll
          if ($LASTEXITCODE -ne 0) { throw "Generated Rust native-mod ABI smoke test failed with exit code $LASTEXITCODE." }

      - name: Install prebuilt Tauri CLI
        run: npm install --no-save @tauri-apps/cli@^2

      - name: Build Windows installer
        run: npx tauri build

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $installer) {
            throw "Tauri build completed without producing an NSIS installer."
          }
          $installer | ForEach-Object { Write-Host "$($_.FullName) ($($_.Length) bytes)" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: 00047-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload no-op native mod test package
        uses: actions/upload-artifact@v4
        with:
          name: 00047-sample-native-mod
          path: ${{ runner.temp }}/00047-sample-native-mod.zip
          if-no-files-found: error
          retention-days: 14
