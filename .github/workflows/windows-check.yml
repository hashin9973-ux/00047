name: Windows verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check frontend JavaScript syntax
        shell: pwsh
        run: |
          node --check ui/blocks.js
          node --check ui/editor.js
          node --check ui/app.js
          node --check ui/native-mods.js

      - name: Validate Tauri JSON configuration
        shell: pwsh
        run: |
          node -e "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('src-tauri/capabilities/default.json', 'utf8'))"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format Rust sources before compilation
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Compile for Windows
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run workflow engine regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and package the native mod SDK sample
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "00047-native-mod-build"
          $stage = Join-Path $env:RUNNER_TEMP "00047-native-mod-package"
          $bin = Join-Path $stage "bin"
          cmake -S samples/native-mod -B $build -A x64
          cmake --build $build --config Release
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item "samples/native-mod/manifest.json" $stage
          Copy-Item (Join-Path $build "Release/00047_sample_native_mod.dll") $bin
          $zip = Join-Path $env:RUNNER_TEMP "00047-sample-native-mod.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "Native mod sample package was not created." }

      - name: Install prebuilt Tauri CLI
        run: npm install --no-save @tauri-apps/cli@^2

      - name: Build Windows installer
        run: npx tauri build

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $installer) {
            throw "Tauri build completed without producing an NSIS installer."
          }
          $installer | ForEach-Object { Write-Host "$($_.FullName) ($($_.Length) bytes)" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: 00047-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload no-op native mod test package
        uses: actions/upload-artifact@v4
        with:
          name: 00047-sample-native-mod
          path: ${{ runner.temp }}/00047-sample-native-mod.zip
          if-no-files-found: error
          retention-days: 14
