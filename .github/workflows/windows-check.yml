name: Windows verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check frontend JavaScript syntax
        shell: pwsh
        run: |
          node --check ui/blocks.js
          node --check ui/editor.js
          node --check ui/app.js

      - name: Validate Tauri JSON configuration
        shell: pwsh
        run: |
          node -e "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('src-tauri/capabilities/default.json', 'utf8'))"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format Rust sources before compilation
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Compile for Windows
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run workflow engine regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install prebuilt Tauri CLI
        run: npm install --no-save @tauri-apps/cli@^2

      - name: Build Windows installer
        run: npx tauri build

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $installer) {
            throw "Tauri build completed without producing an NSIS installer."
          }
          $installer | ForEach-Object { Write-Host "$($_.FullName) ($($_.Length) bytes)" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: 00047-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
